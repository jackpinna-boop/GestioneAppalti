name: Build diagnostic
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  diagnostic:
    if: ${{ !contains(github.event.head_commit.message, 'Capture build diagnostic') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Build and capture diagnostics
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build-diagnostic.txt
          exit ${PIPESTATUS[0]}
      - name: Commit diagnostics
        if: steps.build.outcome == 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-diagnostic.txt
          git commit -m "Capture build diagnostic"
          git push
      - name: Fail diagnostic job
        if: steps.build.outcome == 'failure'
        run: exit 1
