name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Normalize Supabase variables
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$VITE_SUPABASE_URL" == sb_* && "$VITE_SUPABASE_PUBLISHABLE_KEY" == https://* ]]; then
            echo "Detected swapped Supabase variable values; correcting job environment."
            {
              echo "VITE_SUPABASE_URL=$VITE_SUPABASE_PUBLISHABLE_KEY"
              echo "VITE_SUPABASE_PUBLISHABLE_KEY=$VITE_SUPABASE_URL"
            } >> "$GITHUB_ENV"
          fi
          if [[ "$VITE_SUPABASE_URL" != https://*.supabase.co && "$VITE_SUPABASE_URL" != https://*.supabase.in ]]; then
            echo "ERROR: VITE_SUPABASE_URL is not a valid Supabase project URL."
            exit 1
          fi
          if [[ "$VITE_SUPABASE_PUBLISHABLE_KEY" != sb_publishable_* && "$VITE_SUPABASE_PUBLISHABLE_KEY" != eyJ* ]]; then
            echo "ERROR: VITE_SUPABASE_PUBLISHABLE_KEY does not look like a publishable/anon key."
            exit 1
          fi
      - run: npm install
      - run: npm run build
      - name: Verify Supabase Auth API key
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          if [[ "$SUPABASE_URL" == sb_* && "$SUPABASE_KEY" == https://* ]]; then
            tmp="$SUPABASE_URL"
            SUPABASE_URL="$SUPABASE_KEY"
            SUPABASE_KEY="$tmp"
          fi
          code="$(curl -sS -o /tmp/supabase-auth-response.txt -w "%{http_code}" \
            -X POST "$SUPABASE_URL/auth/v1/token?grant_type=password" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            --data '{"email":"invalid-test@example.invalid","password":"invalid-test-password"}')"
          echo "Supabase Auth HTTP status: $code"
          if [ "$code" = "401" ]; then
            echo "ERROR: Supabase rejected the configured API key."
            exit 1
          fi
          if [ "$code" = "400" ]; then
            echo "OK: API key accepted; test credentials correctly rejected."
          else
            echo "Unexpected Auth response status: $code"
            cat /tmp/supabase-auth-response.txt
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
